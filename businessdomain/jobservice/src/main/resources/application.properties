spring.application.name=BUSINESSDOMAIN-JOBSERVICE
spring.config.import=optional:configserver:http://configserver:8888
server.port=0
management.endpoints.web.exposure.include=*

#AÃ±adir path global
#server.servlet.context-path=/api/v1
app.base-url=http://localhost:8081
#SPRING SECURITY
spring.security.person.name=admin
spring.security.person.password=admin
google.api.key=AIzaSyDMrtuq9gs0KuNFIsjz-bRwfPVs73VJ11M

#EUREKA
eureka.client.serviceUrl.defaultZone= ${EUREKA_SERVER:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
# ============================================
# CONFIGURACIÓN ACTIVA: POSTGRESQL
# ============================================

##POSTGRES BD
#spring.datasource.url=jdbc:postgresql://postgres_db:5432/career
spring.datasource.url=jdbc:postgresql://localhost:5433/career
spring.datasource.username=postgres
spring.datasource.password=qwerty
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Scripts SQL específicos para PostgreSQL
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.data-locations=classpath:db/postgres/data.sql

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Deshabilitar consola H2
spring.h2.console.enabled=false


