spring.application.name = config-server
server.port=8888

spring.cloud.config.server.git.uri =  file://${REPOSITORY_PATH:D:/Proyectos/Game/career-life-manager-spring/config-server-repo}
spring.cloud.config.server.git.clone-on-start = true
spring.cloud.config.server.git.default-label = master
spring.security.user.name = admin
spring.security.user.password = qwerty
application.name: config-client
profiles.active= local

##EUREKA CLIENT
eureka.client.serviceUrl.defaultZone= ${EUREKA_SERVER:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
management.endpoints.web.exposure.include=*

##POSTGRES BD
spring.datasource.url=jdbc:postgresql://postgres_db:5432/career
spring.datasource.username=postgres
spring.datasource.password=qwerty
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true